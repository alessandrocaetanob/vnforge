name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  linux:
    name: Linux (sem o app)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build VNForge.NoApp.slnf --configuration Release
      - name: Testes
        run: dotnet test --solution VNForge.NoApp.slnf --configuration Release --no-build

  windows:
    name: Windows (solução inteira)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build VNForge.slnx --configuration Release
      - name: Testes
        run: dotnet test --solution VNForge.slnx --configuration Release --no-build
